name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: compile
      run: gcc test_lista-ox.c -o test_lista-ox
    - name: execute
      run: ./test_lista-ox
    - name: compile programa principal
      run: gcc lista-ox.c -o lista-ox
    - name: execute programa principal
      run: ./lista-ox O O X X X X O X 
